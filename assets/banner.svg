<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <!-- Accent Radial Glow -->
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Card/Pill Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    /* Animations */
    @keyframes pulse {
      0% { r: 120px; opacity: 0.3; }
      50% { r: 160px; opacity: 0.6; }
      100% { r: 120px; opacity: 0.3; }
    }
    @keyframes float1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .pulsing-ring { animation: pulse 4s infinite ease-in-out; }
    .floating-card-1 { animation: float1 5s infinite ease-in-out; }
    .floating-card-2 { animation: float2 6s infinite ease-in-out; }
    .animated-border { stroke-dasharray: 8 4; animation: dash 3s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />
  <circle cx="600" cy="200" r="300" fill="url(#glow)" />

  <!-- Animated Dynamic Elements (In Background Layer) -->
  <circle cx="600" cy="190" r="140" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" class="pulsing-ring" />
  <circle cx="600" cy="190" r="220" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.2" />

  <!-- Floating Decorative Cards -->
  <g class="floating-card-1">
    <rect x="90" y="70" width="210" height="46" rx="23" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="115" cy="93" r="10" fill="#10b981" />
    <text x="135" y="98" class="badge-text" fill="#e2e8f0">SOC 2 Automation ✔</text>
  </g>

  <g class="floating-card-2">
    <rect x="900" y="80" width="210" height="46" rx="23" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="925" cy="103" r="10" fill="#3b82f6" />
    <text x="945" y="108" class="badge-text" fill="#e2e8f0">AI Trust Centers 🛡️</text>
  </g>

  <g class="floating-card-1">
    <rect x="120" y="280" width="220" height="46" rx="23" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="145" cy="303" r="10" fill="#a855f7" />
    <text x="165" y="308" class="badge-text" fill="#e2e8f0">Open-Source GRC 🔓</text>
  </g>

  <g class="floating-card-2">
    <rect x="860" y="270" width="230" height="46" rx="23" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="885" cy="293" r="10" fill="#f59e0b" />
    <text x="905" y="298" class="badge-text" fill="#e2e8f0">Questionnaires 📝</text>
  </g>

  <!-- Animated Orbiting Graphic Line -->
  <path d="M 250 200 Q 600 100 950 200 Q 600 300 250 200 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" class="animated-border" />

  <!-- Shield Logo Icon Center Background -->
  <g transform="translate(570, 45)">
    <path d="M 30 0 L 60 15 V 45 C 60 70 30 90 30 90 C 30 90 0 70 0 45 V 15 Z" fill="url(#shieldGrad)" opacity="0.85" />
    <path d="M 20 40 L 28 48 L 42 32" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Text Content (Positioned strictly on top so never occluded) -->
  <g text-anchor="middle">
    <text x="600" y="195" class="title">Awesome Cloud Security &amp; Trust Center 🛡️</text>
    <text x="600" y="235" class="subtitle">Curated Directory of Commercial Trust Platforms &amp; Open-Source Compliance Tools</text>
  </g>
</svg>
